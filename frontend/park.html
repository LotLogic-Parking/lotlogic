<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/error-reporting.js" defer></script>
  <title>Parking Registration</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@700&display=swap">
  <style>
/* Layout: the sign, continued on the phone. The LotLogic letterhead (logo over a blue rule), one input, one answer. Single light theme on purpose: it matches the printed sign. */
:root{
  --ink:#0B0D10; --paper:#FFFFFF; --mute:#5B606B; --line:#D7DAE0; --brand:#1F5FE0; --brand-deep:#174BB5; --tint:#F4F7FD; --bad:#B42318;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --grotesk:"Space Grotesk","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink);margin:0;height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--display);min-height:100%;display:flex;flex-direction:column}
.band{background:var(--paper);color:var(--ink);padding-block:20px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:440px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:4px solid var(--brand)}
.brand img{width:52px;height:39px;display:block;flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--grotesk);font-weight:700;font-size:28px;letter-spacing:-.02em}
.brand .wm small{margin-top:6px;font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--brand)}
.band h1{margin:28px 0 0;font-family:var(--grotesk);font-weight:700;font-size:clamp(38px,11vw,52px);line-height:.95;letter-spacing:-.03em;text-wrap:balance}
.band p{margin:10px 0 0;font-weight:800;font-size:14px;letter-spacing:.16em;color:var(--brand)}
main{flex:1;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form,.step{display:flex;flex-direction:column;gap:14px}
label{font-weight:800;font-size:13px;letter-spacing:.14em}
.hint{margin:0;color:var(--mute);font-size:15px;line-height:1.45}
#code{font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:.32em;text-align:center;text-transform:uppercase;
  width:100%;padding:14px 0 14px .32em;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);outline:none}
#code:focus-visible{border-color:var(--brand);box-shadow:0 0 0 4px rgba(31,95,224,.25)}
#code[aria-invalid="true"]{border-color:var(--bad)}
.err{margin:0;color:var(--bad);font-weight:600;font-size:15px;min-height:1.4em}
button{font:inherit;font-weight:700;font-size:18px;border-radius:12px;padding:16px 18px;cursor:pointer;border:2px solid var(--brand)}
button:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.primary{background:var(--brand);color:var(--paper)}
.primary:hover:not(:disabled){background:var(--brand-deep);border-color:var(--brand-deep)}
.primary:disabled{background:#AFC4F0;border-color:#AFC4F0;cursor:not-allowed}
.ghost{background:var(--paper);color:var(--brand)}
.found{background:var(--tint);border:1px solid #D3DEF6;border-left:6px solid var(--brand);border-radius:12px;padding:18px}
.found small{display:block;font-weight:800;font-size:12px;letter-spacing:.16em;color:var(--brand)}
.found strong{display:block;margin-top:6px;font-family:var(--grotesk);font-size:28px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.found code{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;color:var(--mute)}
footer{padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer a{color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.step{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="brand">
    <img src="/lotlogic-mark.svg" alt="" width="52" height="39">
    <span class="wm"><b>LotLogic</b><small>PARKING MANAGEMENT</small></span>
  </div>
  <h1>PRIVATE PARKING</h1>
  <p>VEHICLE REGISTRATION</p>
</div></header>

<main><div class="wrap">
  <form id="enter" class="step" novalidate>
    <label for="code">SITE CODE</label>
    <p class="hint">Enter the 4-character code on the sticker under the QR code.</p>
    <input id="code" name="code" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="····" aria-describedby="err">
    <p id="err" class="err" role="alert"></p>
    <button id="find" class="primary" type="submit" disabled>Find my lot</button>
  </form>

  <section id="confirm" class="step" hidden>
    <div class="found">
      <small>YOU ARE PARKED AT</small>
      <strong id="propName"></strong>
      <code id="propCode"></code>
    </div>
    <button id="go" class="primary" type="button">Continue to registration</button>
    <button id="back" class="ghost" type="button">Wrong lot? Re-enter code</button>
  </section>
</div></main>
<footer><div class="wrap">LotLogic Parking Management · <a href="https://lotlogicparking.com">lotlogicparking.com</a></div></footer>
<script>
// /park — the page behind the QR on every universal LotLogic sign.
// The driver types the SITE CODE from the sticker on the sign; we resolve it
// with the anon RPC resolve_site_code() (returns one property's name + slug,
// nothing else) and send them to that property's existing form at /visit/<slug>.
// ?c=CODE skips typing (for sticker QR codes later).
const SUPABASE_URL = 'https://nzdkoouoaedbbccraoti.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZGtvb3VvYWVkYmJjY3Jhb3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMzg2OTQsImV4cCI6MjA4ODcxNDY5NH0.WrlTCKEmmziBUX1E9vBmBpHRSg7_RRKBLIxSPKy189E';

const $ = id => document.getElementById(id);
const input = $('code'), err = $('err'), find = $('find');
let current = null;

// Codes never use O, 0, I, 1 or L.
const clean = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);

input.addEventListener('input', () => {
  const c = clean(input.value);
  if (input.value !== c) input.value = c;
  find.disabled = c.length !== 4;
  err.textContent = ''; input.removeAttribute('aria-invalid');
});

function fail(msg) {
  err.textContent = msg;
  input.setAttribute('aria-invalid', 'true');
  $('confirm').hidden = true; $('enter').hidden = false;
  input.focus(); input.select();
}

async function lookup(code) {
  find.disabled = true; find.textContent = 'Finding…';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/resolve_site_code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_code: code }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows) || !rows.length) {
      fail("That code doesn't match a lot. Check the sticker on the sign and try again.");
      return;
    }
    current = { code, name: rows[0].name, slug: rows[0].qr_code_id };
    $('propName').textContent = current.name;
    $('propCode').textContent = code;
    $('enter').hidden = true; $('confirm').hidden = false; $('go').focus();
  } catch (_) {
    fail("We couldn't check that code right now. Check your signal and try again.");
  } finally {
    find.textContent = 'Find my lot'; find.disabled = clean(input.value).length !== 4;
  }
}

$('enter').addEventListener('submit', e => { e.preventDefault(); const c = clean(input.value); if (c.length === 4) lookup(c); });
$('back').addEventListener('click', () => {
  $('confirm').hidden = true; $('enter').hidden = false; input.value = ''; find.disabled = true; input.focus();
});
$('go').addEventListener('click', () => {
  location.href = '/visit/' + encodeURIComponent(current.slug);
});

const pre = clean(new URLSearchParams(location.search).get('c'));
if (pre.length === 4) { input.value = pre; lookup(pre); }
</script>
</body>
</html>
